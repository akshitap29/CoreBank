
spring.application.name=corebank-api

# MySQL database connection
spring.datasource.url=jdbc:mysql://localhost:3306/corebank_dev
spring.datasource.username=corebank_app
spring.datasource.password=${COREBANK_DB_PASSWORD}

# JPA and Hibernate settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

corebank.jwt.secret=${COREBANK_JWT_SECRET}